<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BanglaConnect - Random Video Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Russo+One&family=Teko:wght@700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body,html{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif}
    .app-container{position:relative;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#000;overflow:hidden}
    




    #remoteVideo{transition:filter 1s ease}
    .brand-overlay{position:absolute;top:16px;left:20px;z-index:10;display:none;align-items:center;gap:10px;font-family:'Orbitron','Russo One',sans-serif;font-weight:900;font-size:18px;font-style:italic;letter-spacing:1px;user-select:none;pointer-events:none}
    .brand-overlay img{height:46px;width:auto;object-fit:contain;display:block}
    #staticContainer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;user-select:none;pointer-events:none}
    #staticVideo{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1}
    .static-brand-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
    .static-brand-content img{height:80px;width:auto;object-fit:contain;filter:drop-shadow(0 4px 15px rgba(0,0,0,.7))}
    .static-brand-text{font-family:'Orbitron','Russo One',sans-serif;font-weight:900;font-size:24px;font-style:italic;letter-spacing:2px}
    .bangla-text{background:linear-gradient(135deg,#f0abfc,#d946ef);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 5px rgba(217,70,239,.4))}
    .connect-text{background:linear-gradient(135deg,#a5b4fc,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 5px rgba(99,102,241,.4))}
    .chat-overlay{position:absolute;bottom:70px;left:20px;z-index:15;max-width:min(350px,80%);display:flex;flex-direction:column;gap:6px;pointer-events:none}
    .chat-bubble{background:rgba(15,12,28,.85);border:1px solid #5a408c;color:#fff;padding:8px 12px;border-radius:8px;font-size:13px;backdrop-filter:blur(4px);animation:fadeIn .3s ease;overflow-wrap:anywhere}
    @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    .bottom-bar{position:absolute;bottom:0;left:0;width:100%;z-index:20;background:rgba(10,8,20,.95);backdrop-filter:blur(10px);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid rgba(255,255,255,.1)}
    .status-container{flex:.8;display:flex;align-items:center;min-width:0}
    #status{width:100%;height:44px;background:#151122;border:1px solid #33274d;border-radius:8px;padding:0 12px;color:#bfa5ff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .online-badge{height:44px;padding:0 14px;background:#151122;border:1px solid #33274d;border-radius:8px;color:#00ff88;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0}
    .online-dot{width:8px;height:8px;background:#00ff88;border-radius:50%;box-shadow:0 0 8px #00ff88;animation:pulseDot 1.5s infinite}
    @keyframes pulseDot{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
    .controls-container{display:flex;gap:8px;align-items:center;justify-content:center;flex-shrink:0}
    .region-select,.gender-select{height:44px;padding:0 12px;background:#1d182e;border:1px solid #5a408c;border-radius:8px;color:#00ff88;font-size:13px;font-weight:700;outline:none;cursor:pointer;transition:all .2s ease}
    .region-select:hover,.gender-select:hover{border-color:#7c3aed}
    .region-select option,.gender-select option{background:#0f0c1c;color:#fff}
    .btn{height:44px;padding:0 16px;border:none;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer;transition:all .2s ease;color:#fff;outline:none;display:flex;align-items:center;justify-content:center;white-space:nowrap}
    .btn:hover{transform:translateY(-2px);filter:brightness(1.15)}.btn:active{transform:translateY(0)}
    #next{background:linear-gradient(135deg,#7c3aed,#6d28d9);box-shadow:0 0 15px rgba(124,58,237,.4)}
    #stop{background:#3b1724;border:1px solid #8c2d43;color:#ffcdd2}
    .message-container{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
    .chat-input-wrapper{width:100%;height:44px;background:#1d182e;border:1px solid #4c3773;border-radius:8px;display:flex;align-items:center;padding:0 8px 0 12px;gap:8px;transition:all .2s}
    .chat-input-wrapper:focus-within{border-color:#8b5cf6;box-shadow:0 0 10px rgba(139,92,246,.3)}
    .chat-region-icon{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;user-select:none}
    .bd-flag-icon{width:18px;height:18px;background:#006a4e;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center}
    .bd-flag-icon:after{content:'';width:8px;height:8px;background:#f42a41;border-radius:50%}
    #chatInput{flex:1;min-width:0;background:transparent;border:none;outline:none;color:#fff;font-size:13px;font-weight:500}
    #chatInput::placeholder{color:#a5a5bd}
    #sendBtn{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border:none;color:#fff;height:32px;padding:0 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
    #sendBtn:hover{filter:brightness(1.2)}#sendBtn svg{width:16px;height:16px;fill:#fff}
    /* Mobile-only elements; desktop layout stays as-is. */
    .mobile-divider{display:none}
    .report-btn{position:absolute;top:10px;right:10px;z-index:18;display:none;padding:3px;background:transparent;border:0;border-radius:0;color:#fff;font-size:25px;line-height:1;cursor:pointer;text-shadow:0 1px 5px #000}
    .filter-toggle{display:block;position:absolute;right:10px;bottom:10px;z-index:20;border:1px solid #5a408c;background:rgba(15,12,28,.92);color:#f3e8ff;border-radius:9px;padding:8px 13px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px #0007}
    .filter-panel{position:absolute;right:10px;bottom:49px;z-index:19;display:none;flex-direction:column;align-items:stretch;gap:5px;width:max-content;max-width:calc(100% - 20px);padding:7px;background:rgba(15,12,28,.96);border:1px solid #5a408c;border-radius:11px;box-shadow:0 8px 24px #0009;backdrop-filter:blur(8px)}
    .filter-panel.open{display:flex}
    .filter-btn{border:1px solid #5a408c;background:rgba(28,22,45,.96);color:#ddd6fe;border-radius:7px;padding:8px 12px;font-size:11px;font-weight:800;cursor:pointer;text-align:left;white-space:nowrap}
    .filter-btn.active{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-color:#c4b5fd;color:#fff;box-shadow:0 0 10px #8b5cf655}
    .filter-hint{color:#c4b5fd;font-size:9px;padding:3px 2px 1px;max-width:210px;line-height:1.3}
    .typing-bubble{color:#00ff88!important;font-style:italic}
    @keyframes mobileFlip{0%{transform:perspective(900px) rotateY(0deg);opacity:1}45%{transform:perspective(900px) rotateY(88deg);opacity:.35}55%{transform:perspective(900px) rotateY(-88deg);opacity:.35}100%{transform:perspective(900px) rotateY(0deg);opacity:1}}
    
    



    @media(max-width:640px){
      body,html{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
      .app-container{height:100vh;height:100dvh;min-height:0;overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
      .video-grid{flex:1;min-height:0;height:auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 43px minmax(0,1fr);gap:0;perspective:1000px}
      .video-box{width:100%;height:auto;min-height:0;min-width:0;position:relative;flex:none}
      .video-box:nth-child(2){height:auto;border-top:0}
      .video-box video{object-fit:contain}
      .brand-overlay>span{display:none!important}
      .brand-overlay img{height:28px}
      .static-brand-content{gap:8px}.static-brand-content img{height:54px}.static-brand-text{font-size:17px;letter-spacing:1px}
      .chat-overlay{bottom:12px;left:10px;max-width:78%;gap:4px}
      .chat-bubble{font-size:11px;padding:6px 8px;border-radius:8px;max-width:100%}
      #remoteChatOverlay{bottom:12px;left:10px;right:10px;max-width:none;align-items:flex-start}
      #localChatOverlay{bottom:12px;left:10px;right:10px;max-width:none;align-items:flex-start}
      .report-btn{display:block}
      .mobile-divider{grid-row:2;display:grid;grid-template-columns:minmax(74px,.82fr) minmax(0,1.15fr) minmax(0,1fr);align-items:center;gap:6px;padding:4px 8px;background:#0a0814;border-top:1px solid #33274d;border-bottom:1px solid #33274d;min-width:0;z-index:12}
      .mobile-online-badge{height:32px;min-width:0;width:100%;padding:0 6px;gap:5px;justify-content:center;font-size:10px;border-radius:7px}
      .mobile-online-badge .online-dot{width:6px;height:6px;flex:none}
      .mobile-region-select,.mobile-gender-select{width:100%;min-width:0;height:32px;padding:0 4px;font-size:10px;text-align:center;border-radius:7px;white-space:nowrap}
      .bottom-bar{position:relative;left:auto;bottom:auto;flex:none;width:100%;padding:7px 9px calc(8px + env(safe-area-inset-bottom));background:rgba(10,8,20,.98);display:flex;align-items:center;gap:0;border-top:1px solid #33274d}
      .status-container,.bottom-bar>.online-badge,.controls-container,.mobile-filter-label{display:none!important}
      .message-container{width:100%;min-width:0;flex:1}
      .chat-input-wrapper{height:42px;padding:0 7px 0 10px;gap:7px;border-radius:9px}
      #chatInput{font-size:13px}
      #sendBtn{height:31px;padding:0 11px}
      .chat-region-icon{width:18px}
      .filter-toggle{display:block}
      .video-grid.flip-next #remoteBox{animation:mobileFlip .42s ease}
    }
    @media(max-width:380px){
      .mobile-divider{grid-template-columns:minmax(68px,.8fr) minmax(0,1.1fr) minmax(0,1fr);gap:4px;padding-left:5px;padding-right:5px}
      .mobile-online-badge{font-size:9px;padding:0 4px}
      .mobile-region-select,.mobile-gender-select{font-size:9px}
      .filter-toggle{padding:7px 10px}
    }
    @media(min-width:769px){
  .report-btn,.mobile-divider{display:none!important}
}
 
 
/* ===== FINAL RESPONSIVE LAYOUT OVERRIDE ===== */

/* DESKTOP */
@media (min-width: 641px) {
  .app-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  .video-grid {
    position: relative;
    flex: 1 1 0;
    width: 100%;
    height: auto;
    min-height: 0;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 12px;
  }

  .video-box {
    position: relative;
    flex: 0 1 calc((100% - 32px) / 2);
    width: calc((100% - 32px) / 2);
    height: auto;
    aspect-ratio: 4 / 3;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  #remoteVideo,
  #localVideo {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .mobile-divider {
    display: none !important;
  }

  .bottom-bar {
    position: relative;
    inset: auto;
    flex: 0 0 auto;
    width: 100%;
    min-height: 68px;
    padding: 8px 12px;
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    z-index: 20;
  }

  .status-container {
    display: flex !important;
    flex: 1 1 130px;
    min-width: 0;
  }

  #status {
    min-width: 0;
    font-size: 11px;
    padding: 0 7px;
  }

  .bottom-bar > .online-badge {
    display: flex !important;
    flex: 0 0 auto;
    padding: 0 9px;
    font-size: 11px;
  }

  .controls-container {
    display: flex !important;
    flex: 0 1 auto;
    min-width: 0;
    gap: 6px;
  }

  .region-select,
  .gender-select {
    min-width: 0;
    max-width: 125px;
    padding: 0 6px;
    font-size: 11px;
  }

  .btn {
    flex: 0 0 auto;
    padding: 0 10px;
  }

  .message-container {
    display: flex !important;
    flex: 1 1 170px;
    min-width: 130px;
  }

  .filter-toggle,
  .filter-panel {
    display: none !important;
  }

  .report-btn {
    display: none !important;
  }
}

/* MOBILE */
@media (max-width: 640px) {
  .app-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    overflow: hidden;
  }

  .video-grid {
    position: relative;
    flex: 1 1 0;
    width: 100%;
    height: auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) 43px minmax(0, 1fr);
    gap: 0;
    padding: 0;
    perspective: 1000px;
  }

  .video-box {
    position: relative;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    flex: none;
    aspect-ratio: auto;
    justify-self: stretch;
    align-self: stretch;
    overflow: hidden;
  }

  #remoteBox {
    grid-row: 1;
  }

  #mobileDivider {
    grid-row: 2;
  }

  #localBox {
    grid-row: 3;
  }

  #remoteVideo,
  #localVideo {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .mobile-divider {
    display: grid !important;
    width: 100%;
    min-width: 0;
    grid-template-columns: minmax(0, .82fr) minmax(0, 1.15fr) minmax(0, 1fr);
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    background: #0a0814;
    border-top: 1px solid #33274d;
    border-bottom: 1px solid #33274d;
    z-index: 12;
  }

  .bottom-bar {
    position: relative;
    inset: auto;
    flex: 0 0 auto;
    width: 100%;
    min-width: 0;
    padding: 7px 9px calc(8px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    gap: 0;
    background: rgba(10, 8, 20, .98);
    border-top: 1px solid #33274d;
  }

  .status-container,
  .bottom-bar > .online-badge,
  .controls-container,
  .mobile-filter-label {
    display: none !important;
  }

  .message-container {
    display: flex !important;
    flex: 1 1 0;
    width: 100%;
    min-width: 0;
  }

  .chat-input-wrapper {
    width: 100%;
    height: 42px;
    min-width: 0;
    padding: 0 7px 0 10px;
    gap: 7px;
    border-radius: 9px;
  }

  #chatInput {
    min-width: 0;
    font-size: 13px;
  }

  #sendBtn {
    height: 31px;
    padding: 0 11px;
  }

  .chat-region-icon {
    width: 18px;
  }

  .chat-overlay {
    bottom: 12px;
    left: 10px;
    max-width: 78%;
    gap: 4px;
  }

  #remoteChatOverlay,
  #localChatOverlay {
    bottom: 12px;
    left: 10px;
    right: 10px;
    max-width: none;
    align-items: flex-start;
  }

  .chat-bubble {
    max-width: 100%;
    font-size: 11px;
    padding: 6px 8px;
  }

  .brand-overlay > span {
    display: none !important;
  }

  .brand-overlay img {
    height: 28px;
  }

  .static-brand-content {
    gap: 8px;
  }

  .static-brand-content img {
    height: 54px;
  }

  .static-brand-text {
    font-size: 17px;
    letter-spacing: 1px;
  }

  .report-btn {
    display: block !important;
  }

  .mobile-online-badge {
    width: 100%;
    height: 32px;
    min-width: 0;
    padding: 0 5px;
    gap: 5px;
    justify-content: center;
    font-size: 10px;
  }

  .mobile-online-badge .online-dot {
    width: 6px;
    height: 6px;
    flex: none;
  }

  .mobile-region-select,
  .mobile-gender-select {
    width: 100%;
    height: 32px;
    min-width: 0;
    padding: 0 4px;
    font-size: 10px;
    text-align: center;
  }

  .filter-toggle {
    display: block !important;
    right: 10px;
    bottom: 10px;
  }

  .filter-panel {
    display: none;
  }

  .filter-panel.open {
    display: flex;
  }

  .video-grid.flip-next #remoteBox {
    animation: mobileFlip .42s ease;
  }
}

@media (max-width: 380px) {
  .mobile-divider {
    grid-template-columns: minmax(0, .8fr) minmax(0, 1.1fr) minmax(0, 1fr);
    gap: 4px;
    padding-left: 5px;
    padding-right: 5px;
  }

  .mobile-online-badge,
  .mobile-region-select,
  .mobile-gender-select {
    font-size: 9px;
  }

  .filter-toggle {
    padding: 7px 10px;
  }
}

 
/* ===== CAMERA ASPECT RATIO FIX ===== */

/* Preserve the natural video ratio; fill the 4:3 box by cropping */
#remoteVideo,
#localVideo {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
}

/* Keep both video panels at 4:3 on desktop */
@media (min-width: 641px) {
  .video-box {
    aspect-ratio: 4 / 3;
    overflow: hidden;
  }
}

/* Mobile: equal video panels with no side bars */
@media (max-width: 640px) {
  #remoteBox,
  #localBox {
    width: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  #remoteVideo,
  #localVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }
}


/* ===== DESKTOP FULL-BLEED VIDEO LAYOUT FIX ===== */
@media (min-width: 641px) {

  /* Remove the empty black space above, below and beside videos */
  .app-container {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    padding: 0;
    gap: 0;
    overflow: hidden;
  }

  .video-grid {
    flex: 1 1 0;
    width: 100%;
    height: auto;
    min-height: 0;
    padding: 0;
    margin: 0;
    gap: 0;
    align-items: stretch;
    justify-content: stretch;
    overflow: hidden;
  }

  /* Make both camera panels fill the available height */
  #remoteBox,
  #localBox {
    flex: 1 1 50%;
    width: 50%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    margin: 0;
    padding: 0;
    aspect-ratio: auto;
    border: 0;
    border-radius: 0;
    overflow: hidden;
  }

  /* Fill each panel without stretching or distorting faces */
  #remoteVideo,
  #localVideo {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
  }

  /* Expand the bottom control bar's background upward in its area */
  .bottom-bar {
    position: relative;
    flex: 0 0 auto;
    width: 100%;
    min-height: 78px;
    margin: 0;
    padding: 12px 16px;
    gap: 8px;
    border-radius: 0;
    box-sizing: border-box;
  }

  .status-container,
  .controls-container,
  .message-container {
    min-width: 0;
  }
}

/* MOBILE ONLY: Fix local camera's horizontal mirroring */
@media (max-width: 640px) {
  #localVideo {
    transform: scaleX(-1);
  }
}

 </style>
</head>
<body>
  <div class="app-container">
    <div class="video-grid" id="videoGrid">
      <div class="video-box" id="remoteBox">
        <div class="brand-overlay" id="brandOverlay"><img src="logo.png" alt="BanglaConnect Logo"><span><span class="bangla-text">Bangla</span> <span class="connect-text">Connect</span></span></div>
        <div id="staticContainer"><video id="staticVideo" src="static.mp4" autoplay loop muted playsinline></video><div class="static-brand-content"><img src="logo.png" alt="BanglaConnect Logo"><div class="static-brand-text"><span class="bangla-text">Bangla</span> <span class="connect-text">Connect</span></div></div></div>
        <div class="chat-overlay" id="remoteChatOverlay"></div>
        <video id="remoteVideo" autoplay playsinline></video>
        <button type="button" id="reportBtn" class="report-btn" aria-label="Report user" title="Report user">⚑</button>
      </div>
      <div class="mobile-divider" id="mobileDivider">
        <div class="online-badge mobile-online-badge"><div class="online-dot"></div><span id="mobileOnlineCountText">Online: 1</span></div>
        <select id="mobileRegionSelect" class="region-select mobile-region-select" title="Select Country" aria-label="Select Country"><option value="BD">🇧🇩 Bangladesh</option><option value="ALL">🌐 All Countries</option></select>
        <select id="mobileGenderSelect" class="gender-select mobile-gender-select" title="Select Gender" aria-label="Select Gender"><option value="ANY">👤 Any Gender</option><option value="MALE">👨 Male</option><option value="FEMALE">👩 Female</option></select>
      </div>

function setupProcessedVideo() {
  if (!localStream || processedCanvas) return;

  processedCanvas = document.createElement("canvas");
  processedCanvas.width = 640;

  processingContext = processedCanvas.getContext("2d", {
    alpha: false

  processingVideo.srcObject = new MediaStream(
    localStream.getVideoTracks()
  );

  function draw() {
    if (!filterProcessingEnabled) {
      processingFrame = null;
      return;

    if (
      !processedCanvas ||
      !processingContext ||
      !processingVideo
    ) {
      processingFrame = null;
      return;
    }

    if (processingVideo.readyState >= 2) {
      processingContext.save();
      processingContext.filter =
        canvasFilters[activeFilter] || "none";

      processingContext.drawImage(
        processingVideo,
        0,
        0,
        processedCanvas.width,
        processedCanvas.height
      );

      processingContext.restore();
    }

    processingFrame = requestAnimationFrame(draw);
  }

  try {
    const videoStream = processedCanvas.captureStream(24);

    processedStream = new MediaStream([
      ...videoStream.getVideoTracks(),
      ...localStream.getAudioTracks()
    ]);
  } catch (error) {
    console.warn("Canvas filter unavailable:", error);
    processedStream = localStream;
  }
